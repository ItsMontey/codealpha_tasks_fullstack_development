<!DOCTYPE html>
<html>
<head>
    <title>Meeting Room</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: "Poppins", "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 16px;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Video Section */
        .video-box {
            grid-column: 1 / 2;
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        video {
            width: 100%;
            height: 240px;
            background: black;
            border-radius: 12px;
            object-fit: cover;
        }

        /* Chat Section */
        .chat-box {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            font-size: 14px;
        }

        .chat-input {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.45);
        }

        /* File Section */
        .file-box {
            grid-column: 1 / 2;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        #fileList {
            margin-top: 8px;
            font-size: 14px;
        }

        /* Whiteboard */
        .board-box {
            grid-column: 1 / 2;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        canvas {
            width: 100%;
            height: 300px;
            background: white;
            border-radius: 12px;
        }

        /* Bottom Controls */
        .controls {
            grid-column: 1 / 3;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
    </style>
</head>

<body align="center">

    <div class="video-box">
        <video id="localVideo" autoplay muted></video>
        <video id="remoteVideo" autoplay></video>
    </div>

    <div class="chat-box">
        <div id="chat"></div>
        <div class="chat-input">
            <input id="msg" placeholder="Type a message...">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <div class="file-box">
        <input type="file" id="fileInput">
        <div id="fileList"></div>
    </div>

    <div class="board-box">
        <canvas id="board" width="300" height="300"></canvas>
    </div>

    <div class="controls">
        <button onclick="share()">Share Screen</button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/webrtc.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/file.js"></script>
    <script src="js/whiteboard.js"></script>
    <script src="js/screen.js"></script>

</body>
</html>
