<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Social Media</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .post {
            background: #ffffff;
            padding: 15px 18px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .username {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .content {
            color: #444;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .like {
            text-decoration: none;
            color: #e74c3c;
            font-weight: bold;
        }

        .like:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Feed</h2>

    {% for post in posts %}
    <div class="post">
        <div class="username">{{ post.user.username }}</div>
        <div class="content">{{ post.content }}</div>

        <a href="{% url 'like' post.id %}" class="like">
            ❤️ {{ post.likes.count }}
        </a>
    </div>
    {% endfor %}
</div>

</body>
</html>
