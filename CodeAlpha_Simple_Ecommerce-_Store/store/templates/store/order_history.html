<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        th {
            background-color: #f0f2f5;
            color: #333;
        }

        tr:hover {
            background-color: #fafafa;
        }

        .empty {
            text-align: center;
            font-size: 16px;
            color: #777;
            margin: 20px 0;
        }

        .back-btn {
            text-align: center;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📦 My Orders</h1>

    {% if orders %}
        <table>
            <tr>
                <th>Order ID</th>
                <th>Total Price</th>
                <th>Order Date</th>
            </tr>

            {% for order in orders %}
            <tr>
                <td>{{ order.id }}</td>
                <td>₹{{ order.total_price }}</td>
                <td>{{ order.created_at }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p class="empty">No orders found.</p>
    {% endif %}

    <div class="back-btn">
        <a href="{% url 'home' %}">
            <button>Back to Home</button>
        </a>
    </div>
</div>

</body>
</html>
