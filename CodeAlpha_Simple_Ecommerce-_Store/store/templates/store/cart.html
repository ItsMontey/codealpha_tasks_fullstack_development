<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-info {
            font-size: 16px;
            color: #444;
        }

        .item-actions a {
            text-decoration: none;
            margin-left: 10px;
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-btn {
            background-color: #e74c3c;
            color: white;
        }

        .qty-btn {
            background-color: #ecf0f1;
            color: #333;
            font-weight: bold;
        }

        .total {
            text-align: right;
            font-size: 20px;
            margin-top: 20px;
            color: #222;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .actions a button {
            padding: 10px 18px;
            font-size: 15px;
        }

        .shop-btn {
            background-color: #3498db;
            color: white;
        }

        .order-btn {
            background-color: #2ecc71;
            color: white;
        }

        .empty {
            text-align: center;
            font-size: 18px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Your Cart</h1>

    {% for item in items %}
    <div class="cart-item">
        <div class="item-info">
            {{ item.product.name }} -
            ₹{{ item.product.price }} × {{ item.quantity }}
        </div>

        <div class="item-actions">
            <a href="{% url 'remove_from_cart' item.id %}">
                <button class="remove-btn">Remove</button>
            </a>
        </div>
    </div>
    {% empty %}
    <p class="empty">Cart is Empty</p>
    {% endfor %}

    <h3 class="total">Total : ₹{{ total }}</h3>

    <div class="actions">
        <a href="{% url 'home' %}">
            <button class="shop-btn">Continue Shopping</button>
        </a>

        <a href="{% url 'place_order' %}">
            <button class="order-btn">Place Order</button>
        </a>
    </div>

    {% for item in cart_items %}
    <div class="cart-item">
        <div class="item-info">
            {{ item.product.name }} -
            ₹{{ item.product.price }} × {{ item.quantity }}
        </div>

        <div class="item-actions">
            <a href="{% url 'update_cart' item.id 'minus' %}">
                <button class="qty-btn">➖</button>
            </a>
            <a href="{% url 'update_cart' item.id 'plus' %}">
                <button class="qty-btn">➕</button>
            </a>
        </div>
    </div>
    {% endfor %}

</div>

</body>
</html>
