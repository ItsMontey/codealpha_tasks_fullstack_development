<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 420px;
            margin: 100px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        #pay-btn {
            padding: 12px 26px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background-color: #2ecc71;
            color: white;
            cursor: pointer;
        }

        #pay-btn:hover {
            background-color: #27ae60;
        }

        .secure {
            margin-top: 15px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Pay ₹{{ amount }}</h2>

    <button id="pay-btn">Pay Now</button>

    <p class="secure">🔒 Secure payment via Razorpay</p>
</div>

<script>
    var options ={
        "key": "{{ razorpay_key }}",
        "ammount": "{{ amount }}00",
        "currency":"INR",
        "name":"My Store",
        "description":"Order Payment",
        "order_id":"{{ order_id }}",
        "handler" : function (responce){
            alert("Payment Successfull!");
            window.location.href="/order-success/";
        }
    };
    var rzpl = new Razorpay(options);
    document.getElementById('pay-btn').onclick = function(e){
        e.preventDefault();
        
    }
</script>

</body>
</html>
